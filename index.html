<!DOCTYPE html>
<html>
<head>
  <title>Trang của tôi</title>
  <style>
    body {
      background-color: #1a1a2e;
      color: white;
      font-family: Arial;
      text-align: center;
      margin: 0;
      padding-bottom: 70px;
    }
    .nut {
      background-color: #e94560;
      color: white;
      padding: 12px 30px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      margin: 5px;
      cursor: pointer;
    }
    .trang {
      display: none;
      padding: 20px;
    }
    .trang.active {
      display: block;
    }
    .menu-duoi {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #16213e;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
    }
    .menu-item {
      color: white;
      font-size: 13px;
      text-align: center;
      cursor: pointer;
    }
    .menu-item span {
      display: block;
      font-size: 22px;
    }
    .input-dep {
      padding: 10px;
      border-radius: 10px;
      border: none;
      width: 80%;
      background-color: #0f3460;
      color: white;
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <!-- TRANG CHỦ -->
  <div id="trangChuPage" class="trang active">
    <div style="position:fixed; top:0; left:0; width:100%; background-color:#1a1a2e; padding:10px; text-align:center; z-index:999;">
      <input type="file" accept="image/*" id="chonAnh" style="display:none;" onchange="xemAnh()">
      <button class="nut" onclick="document.getElementById('chonAnh').click()">📷 Đăng ảnh</button>
      <br>
      <input type="text" id="ghiChu" placeholder="Thêm ghi chú..." class="input-dep">
    </div>

    <div id="danhSachBai" style="margin-top:120px; padding-bottom:70px;">
      <div style="text-align:center; padding:20px 0; border-bottom:1px solid #333;">
        <div style="width:300px; height:300px; border-radius:20px; background-color:#e94560; display:flex; align-items:center; justify-content:center; font-size:80px; margin:0 auto;">🌅</div>
        <p style="font-weight:bold; margin:10px 0 0 0;">Nguyễn Văn A</p>
        <p style="color:gray; font-size:14px; margin:5px 0;">Hôm nay trời đẹp quá!</p>
        <div style="display:flex; gap:20px; justify-content:center; margin-top:10px;">
          <button onclick="like(this)" style="background:none; border:none; color:white; font-size:20px;">❤️ <span>12</span></button>
          <button onclick="binhLuan(1)" style="background:none; border:none; color:white; font-size:20px;">💬 <span>3</span></button>
        </div>
        <div id="bl1" style="display:none; width:90%; background-color:#16213e; border-radius:10px; padding:10px; margin:10px auto;">
          <div id="danhsachbl1"></div>
          <input id="nhapbl1" type="text" placeholder="Bình luận..." class="input-dep" style="width:60%;">
          <button onclick="guiBinhLuan(1)" class="nut" style="padding:8px 15px; font-size:13px;">Gửi</button>
        </div>
      </div>

      <div style="text-align:center; padding:20px 0; border-bottom:1px solid #333;">
        <div style="width:300px; height:300px; border-radius:20px; background-color:#2d6a4f; display:flex; align-items:center; justify-content:center; font-size:80px; margin:0 auto;">🌃</div>
        <p style="font-weight:bold; margin:10px 0 0 0;">Trần Thị B</p>
        <p style="color:gray; font-size:14px; margin:5px 0;">Đêm nay buồn ghê!</p>
        <div style="display:flex; gap:20px; justify-content:center; margin-top:10px;">
          <button onclick="like(this)" style="background:none; border:none; color:white; font-size:20px;">❤️ <span>8</span></button>
          <button onclick="binhLuan(2)" style="background:none; border:none; color:white; font-size:20px;">💬 <span>1</span></button>
        </div>
        <div id="bl2" style="display:none; width:90%; background-color:#16213e; border-radius:10px; padding:10px; margin:10px auto;">
          <div id="danhsachbl2"></div>
          <input id="nhapbl2" type="text" placeholder="Bình luận..." class="input-dep" style="width:60%;">
          <button onclick="guiBinhLuan(2)" class="nut" style="padding:8px 15px; font-size:13px;">Gửi</button>
        </div>
      </div>
    </div>
  </div>
  <!-- TRANG TÌM KIẾM -->
  <div id="timKiemPage" class="trang">
    <h1 style="color:#e94560;">Tìm kiếm</h1>
    <input type="text" id="tuKhoa" placeholder="Tìm gì đó..." class="input-dep">
    <br><br>
    <button class="nut" onclick="timKiem()">🔍 Tìm</button>
    <p id="ketQua"></p>
  </div>

  <!-- TRANG CHAT -->
<div id="chatPage" class="trang">
  <h1 style="color:#e94560;">Chat</h1>

  <div style="margin-bottom:10px;">
<button class="nut" style="font-size:13px; padding:8px 15px;" onclick="doiNen('#808080')">Xám</button>
<button class="nut" style="font-size:13px; padding:8px 15px;" onclick="doiNen('#000000')">Đen</button>
<button class="nut" style="font-size:13px; padding:8px 15px;" onclick="doiNen('#1a1a2e')">Xanh đen</button>
<button class="nut" style="font-size:13px; padding:8px 15px;" onclick="doiNen('#FFD700')">Vàng</button>
<button class="nut" style="font-size:13px; padding:8px 15px;" onclick="doiNen('#ffffff'); document.body.style.color='black'">Trắng</button>
  </div>

  <!-- Danh sách người dùng -->
  <div id="danhSachNguoiDung" style="margin-bottom:10px;">
    <h3 style="color:gray;">Chọn người để chat:</h3>
    <div id="danhSachND" style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center;"></div>
  </div>

  <!-- Khung chat -->
  <div id="khungChatRieng" style="display:none;">
    <p id="tenNguoiChat" style="color:#e94560; font-weight:bold;"></p>
    <button onclick="quayLaiDanhSach()" style="background:none; border:none; color:gray; font-size:13px;">← Quay lại</button>
    <div id="khungChat" style="background-color:#16213e; height:400px; overflow-y:auto; padding:10px; width:100%; box-sizing:border-box; text-align:left;"></div>
    <div style="display:flex; padding:10px; gap:5px;">
      <input type="text" id="hopTinNhan" placeholder="Nhập tin nhắn..." class="input-dep" style="width:70%; margin:0;">
      <button class="nut" onclick="guitinnhan()" style="padding:10px 15px;">Gửi</button>
    </div>
  </div>
</div>
  <!-- TRANG CÁ NHÂN -->
  <div id="caNhanPage" class="trang">

    <!-- Phần đăng nhập/tạo tài khoản -->
    <div id="khungDangNhap">
      <h1 style="color:#e94560;">Cá nhân</h1>
      <input type="text" id="tenNguoiDung" placeholder="Tên của bạn" class="input-dep">
      <br>
      <input type="password" id="matKhau" placeholder="Mật khẩu" class="input-dep">
      <br><br>
      <button class="nut" onclick="taoTaiKhoan()">Tạo tài khoản</button>
      <button class="nut" onclick="dangNhap()">Đăng nhập</button>
    </div>

    <!-- Phần hồ sơ sau khi đăng nhập -->
    <div id="hoSo" style="display:none;">
      <div style="width:80px; height:80px; border-radius:50%; background-color:#e94560; margin:0 auto; font-size:40px; line-height:80px;">👤</div>
      <h2 id="tenHienThi" style="margin:10px 0 0 0;">Tên người dùng</h2>
      <p style="color:gray; margin:5px 0;">@tendangnhap</p>
      <button class="nut" style="font-size:13px; padding:8px 20px;">Chỉnh sửa trang cá nhân</button>
      <button class="nut" style="font-size:13px; padding:8px 20px; background-color:#333;" onclick="dangXuat()">Đăng xuất</button>

      <div style="display:flex; justify-content:space-around; padding:15px; border-top:1px solid #333; border-bottom:1px solid #333; margin-top:15px;">
        <div>
          <strong>128</strong>
          <p style="color:gray; margin:0; font-size:13px;">Đang follow</p>
        </div>
        <div>
          <strong>1.2K</strong>
          <p style="color:gray; margin:0; font-size:13px;">Followers</p>
        </div>
        <div>
          <strong>4.5K</strong>
          <p style="color:gray; margin:0; font-size:13px;">Thích</p>
        </div>
      </div>

      <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:2px; margin-top:2px;">
        <div style="background-color:#16213e; aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:30px;">🎵</div>
        <div style="background-color:#16213e; aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:30px;">🎵</div>
        <div style="background-color:#16213e; aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:30px;">🎵</div>
        <div style="background-color:#16213e; aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:30px;">🎵</div>
        <div style="background-color:#16213e; aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:30px;">🎵</div>
        <div style="background-color:#16213e; aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:30px;">🎵</div>
      </div>
    </div>
  </div>
  <!-- THANH MENU DƯỚI -->
  <div class="menu-duoi">
    <div class="menu-item" onclick="chuyenTrang('trangChuPage')">
      <span>🏠</span>Trang chủ
    </div>
    <div class="menu-item" onclick="chuyenTrang('timKiemPage')">
      <span>🔍</span>Tìm kiếm
    </div>
    <div class="menu-item" onclick="chuyenTrang('chatPage')">
      <span>💬</span>Chat
    </div>
    <div class="menu-item" onclick="chuyenTrang('caNhanPage')">
      <span>👤</span>Cá nhân
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAsOsURWu5zZls4P1m2eQ-cja1MaNqPZOg",
    authDomain: "shent-zekrom-e1b75.firebaseapp.com",
    projectId: "shent-zekrom-e1b75",
    storageBucket: "shent-zekrom-e1b75.firebasestorage.app",
    messagingSenderId: "474389599605",
    appId: "1:474389599605:web:f9290355487ba0fbab2f3c"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  console.log("Firebase kết nối thành công!");
</script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script>
    let danhSachTK = {};
    let viTri = 0;
    let danhSachMau = ['#1a1a2e', '#e94560', '#f4a261', '#2d6a4f', 'purple'];

    function chuyenTrang(tenTrang) {
      let tatCaTrang = document.querySelectorAll('.trang');
      tatCaTrang.forEach(t => t.classList.remove('active'));
      document.getElementById(tenTrang).classList.add('active');
    }

    function like(nut) {
      let so = nut.querySelector("span");
      so.innerText = parseInt(so.innerText) + 1;
    }

    function binhLuan(id) {
      let khung = document.getElementById("bl" + id);
      if (khung.style.display === "none") {
        khung.style.display = "block";
      } else {
        khung.style.display = "none";
      }
    }

    function guiBinhLuan(id) {
      let o = document.getElementById("nhapbl" + id);
      let khung = document.getElementById("danhsachbl" + id);
      if (o.value === "") return;
      khung.innerHTML += "<p style='margin:5px 0; text-align:left;'>💬 " + o.value + "</p>";
      o.value = "";
    }

    function timKiem() {
      let tu = document.getElementById("tuKhoa").value;
      document.getElementById("ketQua").innerHTML = "Bạn vừa tìm: " + tu;
    }

    function doiNen(mau) {
      document.body.style.backgroundColor = mau;
    }

function taiTinNhan() {
  db.collection("tinnhan").doc(phongChatHienTai)
  .collection("messages").orderBy("thoiGian")
  .onSnapshot(function(snapshot) {
    let khung = document.getElementById("khungChat");
    khung.innerHTML = "";
    snapshot.forEach(function(doc) {
      let data = doc.data();
      let user = firebase.auth().currentUser;
      let laMinh = user && data.uid === user.uid;
      khung.innerHTML += `<p style='margin:5px 0; text-align:${laMinh ? "right" : "left"};'>${laMinh ? "🧑" : "👤"} ${data.noidung}</p>`;
    });
    khung.scrollTop = khung.scrollHeight;
  });
}

function guitinnhan() {
  let user = firebase.auth().currentUser;
  if (!user) { alert("Đăng nhập trước!"); return; }
  let tinnhan = document.getElementById("hopTinNhan").value;
  if (tinnhan === "") return;
  db.collection("tinnhan").doc(phongChatHienTai)
  .collection("messages").add({
    noidung: tinnhan,
    uid: user.uid,
    thoiGian: Date.now()
  }).then(function() {
    document.getElementById("hopTinNhan").value = "";
  });
}

function taoTaiKhoan() {
  let ten = document.getElementById("tenNguoiDung").value;
  let mk = document.getElementById("matKhau").value;
  if (ten === "" || mk === "") {
    alert("Điền đầy đủ tên và mật khẩu!");
    return;
  }
  firebase.auth().createUserWithEmailAndPassword(ten + "@webcuatoi.com", mk)
  .then(function(userCredential) {
    let user = userCredential.user;
    return user.updateProfile({ displayName: ten }).then(function() {
      return db.collection("nguoidung").doc(user.uid).set({
        ten: ten,
        uid: user.uid,
        thoiGianTao: Date.now()
      });
    });
  }).then(function() {
    alert("Tạo tài khoản thành công!");
  }).catch(function(error) {
    alert("Lỗi: " + error.message);
  });
}

function dangNhap() {
  let ten = document.getElementById("tenNguoiDung").value;
  let mk = document.getElementById("matKhau").value;
  firebase.auth().signInWithEmailAndPassword(ten + "@webcuatoi.com", mk)
  .then(function(userCredential) {
    let user = userCredential.user;
    document.getElementById("khungDangNhap").style.display = "none";
    document.getElementById("hoSo").style.display = "block";
    document.getElementById("tenHienThi").innerText = user.displayName;
    taiDanhSachNguoiDung();
  }).catch(function(error) {
    alert("Sai tên hoặc mật khẩu!");
  });
}

function dangXuat() {
  firebase.auth().signOut().then(function() {
    document.getElementById("khungDangNhap").style.display = "block";
    document.getElementById("hoSo").style.display = "none";
  });
}

    function xemAnh() {
  let file = document.getElementById("chonAnh").files[0];
  let reader = new FileReader();
  reader.onload = function(e) {
    let id = Date.now();
    let ghiChu = document.getElementById("ghiChu").value || "Không có ghi chú";

    // Nén ảnh trước khi lưu
    let canvas = document.createElement("canvas");
    let img = new Image();
    img.onload = function() {
      canvas.width = 400;
      canvas.height = 400;
      let ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, 400, 400);
      let anhNen = canvas.toDataURL("image/jpeg", 0.5);

      // Lưu lên Firestore
      db.collection("baidang").add({
        anh: anhNen,
        ghiChu: ghiChu,
        thoiGian: Date.now(),
        luot_like: 0
      }).then(function() {
        hienBaiDang(id, anhNen, ghiChu);
        document.getElementById("ghiChu").value = "";
        alert("Đăng ảnh thành công!");
      }).catch(function(error) {
        alert("Lỗi: " + error);
      });
    }
    img.src = e.target.result;
  }
  reader.readAsDataURL(file);
}

function hienBaiDang(id, anh, ghiChu) {
  let baiMoi = document.createElement("div");
  baiMoi.style = "text-align:center; padding:20px 0; border-bottom:1px solid #333;";
  baiMoi.innerHTML = `
    <img src="${anh}" style="width:300px; height:300px; border-radius:20px; object-fit:cover;">
    <p style="font-weight:bold; margin:10px 0 0 0;">Bạn vừa đăng!</p>
    <p style="color:gray; font-size:14px; margin:5px 0;">${ghiChu}</p>
    <div style="display:flex; gap:20px; justify-content:center; margin-top:10px;">
      <button onclick="like(this)" style="background:none; border:none; color:white; font-size:20px;">❤️ <span>0</span></button>
      <button onclick="binhLuan(${id})" style="background:none; border:none; color:white; font-size:20px;">💬 <span>0</span></button>
    </div>
    <div id="bl${id}" style="display:none; width:90%; background-color:#16213e; border-radius:10px; padding:10px; margin:10px auto;">
      <div id="danhsachbl${id}"></div>
      <input id="nhapbl${id}" type="text" placeholder="Bình luận..." class="input-dep" style="width:60%;">
      <button onclick="guiBinhLuan(${id})" class="nut" style="padding:8px 15px; font-size:13px;">Gửi</button>
    </div>
  `;
  document.getElementById("danhSachBai").prepend(baiMoi);
}
function taiTatCaBai() {
  db.collection("baidang").orderBy("thoiGian", "desc").get()
  .then(function(querySnapshot) {
    querySnapshot.forEach(function(doc) {
      let data = doc.data();
      let id = doc.id;
      hienBaiDang(id, data.anh, data.ghiChu);
    });
  });
}

let phongChatHienTai = "";

function taiDanhSachNguoiDung() {
  db.collection("nguoidung").get().then(function(snapshot) {
    let khung = document.getElementById("danhSachND");
    khung.innerHTML = "";
    snapshot.forEach(function(doc) {
      let data = doc.data();
      let user = firebase.auth().currentUser;
      if (user && data.uid !== user.uid) {
        khung.innerHTML += `<button class="nut" style="padding:8px 15px; font-size:13px;" onclick="moChat('${data.uid}', '${data.ten}')">${data.ten}</button>`;
      }
    });
    if (khung.innerHTML === "") {
      khung.innerHTML = "<p style='color:gray;'>Chưa có người dùng nào!</p>";
    }
  });
}

function moChat(uid, ten) {
  let user = firebase.auth().currentUser;
  if (!user) {
    alert("Bạn cần đăng nhập trước!");
    return;
  }
  phongChatHienTai = [user.uid, uid].sort().join("_");
  document.getElementById("tenNguoiChat").innerText = "Chat với: " + ten;
  document.getElementById("danhSachNguoiDung").style.display = "none";
  document.getElementById("khungChatRieng").style.display = "block";
  taiTinNhan();
}

function quayLaiDanhSach() {
  document.getElementById("danhSachNguoiDung").style.display = "block";
  document.getElementById("khungChatRieng").style.display = "none";
  document.getElementById("khungChat").innerHTML = "";
}
taiTatCaBai();taiTinNhan();taiDanhSachNguoiDung();
  </script>
</body>
</html>
